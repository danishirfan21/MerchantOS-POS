# Local database-only helper. Full HTTPS stack: deploy/compose.yml.
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: merchantos
      POSTGRES_USER: merchantos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - merchantos_postgres:/var/lib/postgresql/data
      - ${MERCHANT_DB_PASSWORD_FILE:?supply an absolute password-file path}:/run/secrets/db_password:ro
    ports: ["127.0.0.1:5433:5432"]
volumes:
  merchantos_postgres:
