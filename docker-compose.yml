services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchantos
      POSTGRES_USER: merchantos
      POSTGRES_PASSWORD: merchantos_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - merchantos_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchantos -d merchantos"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./services/merchant-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MerchantDb: "Host=db;Port=5432;Database=merchantos;Username=merchantos;Password=merchantos_dev"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  merchantos_postgres:
